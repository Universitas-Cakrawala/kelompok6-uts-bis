# 6 test kualitas data — severity wajib: blocking | warning
# expected: pass | fail   (fail = memang menangkap masalah yang kamu lihat di profil)
# sql harus mengembalikan SATU angka: jumlah baris yang melanggar.
# Angka di `perkiraan_baris` diambil dari `pipeline.profile`, bukan tebakan.

tests:
  # ---------------------------------------------------------------- T1 Kampus
  - name: nim_duplikat
    topic: t1
    severity: warning
    scope: source
    sql: >-
      SELECT count(*) FROM (SELECT nim FROM raw_mahasiswa GROUP BY 1 HAVING count(*) > 1)
    expected: pass
    perkiraan_baris: 0
    justifikasi: NIM adalah kunci bisnis mahasiswa; duplikat di sini berarti dua orang terbaca satu.
  - name: presensi_duplikat_grain
    topic: t1
    severity: blocking
    scope: source
    sql: >-
      SELECT count(*) FROM (SELECT nim, kode_mk, tanggal FROM raw_presensi
      GROUP BY 1,2,3 HAVING count(*) > 1)
    expected: fail
    perkiraan_baris: 4344
    justifikasi: Grain fact presensi = satu mahasiswa per pertemuan per MK; baris kembar menggandakan kehadiran.
  - name: tanggal_presensi_format_lain
    topic: t1
    severity: blocking
    scope: source
    sql: >-
      SELECT count(*) FROM raw_presensi WHERE tanggal LIKE '__/__/____'
    expected: fail
    perkiraan_baris: 5812
    justifikasi: dd/mm/yyyy tidak bisa diparse sebagai ISO; kalau dibiarkan, tanggalnya jadi NULL atau salah.
  - name: nilai_di_luar_rentang
    topic: t1
    severity: blocking
    scope: source
    sql: >-
      SELECT count(*) FROM raw_nilai
      WHERE TRY_CAST(nilai_angka AS INT) > 100 OR TRY_CAST(nilai_angka AS INT) < 0
    expected: fail
    perkiraan_baris: 2
    justifikasi: Nilai 117 dan -5 bukan nilai; keduanya merusak rata-rata per MK.
  - name: status_presensi_di_luar_domain
    topic: t1
    severity: warning
    scope: source
    sql: >-
      SELECT count(*) FROM raw_presensi
      WHERE upper(trim(status)) NOT IN ('HADIR','H','IZIN','SAKIT','ALPA')
    expected: fail
    perkiraan_baris: 11819
    justifikasi: 9 varian kapital bercampur; harus dinormalkan sebelum jadi measure.
  - name: mahasiswa_angkatan_kosong
    topic: t1
    severity: blocking
    scope: source
    sql: >-
      SELECT count(*) FROM raw_mahasiswa WHERE angkatan IS NULL OR angkatan = ''
    expected: fail
    perkiraan_baris: 62
    justifikasi: Slice tim dibentuk dari angkatan; baris tanpa angkatan tidak masuk tim mana pun.

  # ---------------------------------------------------------------- T2 POS UMKM / Kelompok 6 / k9
  - name: transaction_id_duplikat_k9
    topic: t2
    severity: blocking
    scope: source
    sql: >-
      WITH slice AS (SELECT t.* FROM raw_transactions t WHERE t.outlet_id = 'OUT-A' AND CAST(CASE WHEN
      upper(trim(t.tanggal_waktu)) LIKE '%Z' THEN TRY_CAST(t.tanggal_waktu AS TIMESTAMPTZ) AT TIME ZONE
      'Asia/Jakarta' ELSE TRY_CAST(t.tanggal_waktu AS TIMESTAMP) END AS DATE) >= DATE '2025-01-01' AND
      CAST(CASE WHEN upper(trim(t.tanggal_waktu)) LIKE '%Z' THEN TRY_CAST(t.tanggal_waktu AS TIMESTAMPTZ) AT
      TIME ZONE 'Asia/Jakarta' ELSE TRY_CAST(t.tanggal_waktu AS TIMESTAMP) END AS DATE) < DATE '2025-07-01')
      SELECT count(*) FROM (SELECT transaction_id FROM slice GROUP BY 1 HAVING count(*) > 1)
    expected: fail
    perkiraan_baris: 34
    justifikasi: ID transaksi kembar pada Outlet A/periode menyebabkan item ter-join berulang; unitnya kelompok ID.
  - name: transaction_id_konflik_k9
    topic: t2
    severity: blocking
    scope: source
    sql: >-
      WITH slice AS (SELECT t.* FROM raw_transactions t WHERE t.outlet_id = 'OUT-A' AND CAST(CASE WHEN
      upper(trim(t.tanggal_waktu)) LIKE '%Z' THEN TRY_CAST(t.tanggal_waktu AS TIMESTAMPTZ) AT TIME ZONE
      'Asia/Jakarta' ELSE TRY_CAST(t.tanggal_waktu AS TIMESTAMP) END AS DATE) >= DATE '2025-01-01' AND
      CAST(CASE WHEN upper(trim(t.tanggal_waktu)) LIKE '%Z' THEN TRY_CAST(t.tanggal_waktu AS TIMESTAMPTZ) AT
      TIME ZONE 'Asia/Jakarta' ELSE TRY_CAST(t.tanggal_waktu AS TIMESTAMP) END AS DATE) < DATE '2025-07-01')
      SELECT count(*) FROM (SELECT transaction_id FROM slice GROUP BY 1 HAVING count(DISTINCT
      concat_ws('|',coalesce(outlet_id,''),coalesce(customer_id,''),coalesce(tanggal_waktu,''),coalesce(status,''),coalesce(total_bayar,'')))
      > 1)
    expected: fail
    perkiraan_baris: 4
    justifikasi: Header dengan ID sama tetapi atribut berbeda tidak punya aturan pilih yang aman dan harus dikarantina; unitnya ID.
  - name: item_id_duplikat_k9
    topic: t2
    severity: blocking
    scope: source
    sql: >-
      WITH slice AS (SELECT t.* FROM raw_transactions t WHERE t.outlet_id = 'OUT-A' AND CAST(CASE WHEN
      upper(trim(t.tanggal_waktu)) LIKE '%Z' THEN TRY_CAST(t.tanggal_waktu AS TIMESTAMPTZ) AT TIME ZONE
      'Asia/Jakarta' ELSE TRY_CAST(t.tanggal_waktu AS TIMESTAMP) END AS DATE) >= DATE '2025-01-01' AND
      CAST(CASE WHEN upper(trim(t.tanggal_waktu)) LIKE '%Z' THEN TRY_CAST(t.tanggal_waktu AS TIMESTAMPTZ) AT
      TIME ZONE 'Asia/Jakarta' ELSE TRY_CAST(t.tanggal_waktu AS TIMESTAMP) END AS DATE) < DATE '2025-07-01'),
      item_slice AS (SELECT i.* FROM raw_transaction_items i WHERE EXISTS (SELECT 1 FROM slice t WHERE
      t.transaction_id=i.transaction_id)) SELECT count(*) FROM (SELECT item_id FROM item_slice GROUP BY 1
      HAVING count(*) > 1)
    expected: fail
    perkiraan_baris: 42
    justifikasi: Item ID kembar menggandakan nilai penjualan; unitnya kelompok item_id sebelum deduplikasi.
  - name: qty_negatif_paid_k9
    topic: t2
    severity: blocking
    scope: source
    sql: >-
      WITH slice AS (SELECT t.* FROM raw_transactions t WHERE t.outlet_id = 'OUT-A' AND CAST(CASE WHEN
      upper(trim(t.tanggal_waktu)) LIKE '%Z' THEN TRY_CAST(t.tanggal_waktu AS TIMESTAMPTZ) AT TIME ZONE
      'Asia/Jakarta' ELSE TRY_CAST(t.tanggal_waktu AS TIMESTAMP) END AS DATE) >= DATE '2025-01-01' AND
      CAST(CASE WHEN upper(trim(t.tanggal_waktu)) LIKE '%Z' THEN TRY_CAST(t.tanggal_waktu AS TIMESTAMPTZ) AT
      TIME ZONE 'Asia/Jakarta' ELSE TRY_CAST(t.tanggal_waktu AS TIMESTAMP) END AS DATE) < DATE '2025-07-01')
      SELECT count(*) FROM raw_transaction_items i WHERE TRY_CAST(i.qty AS INTEGER) < 0 AND EXISTS (SELECT 1
      FROM slice t WHERE t.transaction_id=i.transaction_id AND upper(trim(t.status)) = 'PAID')
    expected: fail
    perkiraan_baris: 92
    justifikasi: Qty negatif pada transaksi PAID membuat nilai item tidak layak dijumlah; unitnya baris item mentah, tanpa JOIN pengganda.
  - name: transaksi_tanpa_item_k9
    topic: t2
    severity: warning
    scope: source
    sql: >-
      WITH slice AS (SELECT t.* FROM raw_transactions t WHERE t.outlet_id = 'OUT-A' AND CAST(CASE WHEN
      upper(trim(t.tanggal_waktu)) LIKE '%Z' THEN TRY_CAST(t.tanggal_waktu AS TIMESTAMPTZ) AT TIME ZONE
      'Asia/Jakarta' ELSE TRY_CAST(t.tanggal_waktu AS TIMESTAMP) END AS DATE) >= DATE '2025-01-01' AND
      CAST(CASE WHEN upper(trim(t.tanggal_waktu)) LIKE '%Z' THEN TRY_CAST(t.tanggal_waktu AS TIMESTAMPTZ) AT
      TIME ZONE 'Asia/Jakarta' ELSE TRY_CAST(t.tanggal_waktu AS TIMESTAMP) END AS DATE) < DATE '2025-07-01')
      SELECT count(*) FROM slice t WHERE NOT EXISTS (SELECT 1 FROM raw_transaction_items i WHERE
      i.transaction_id=t.transaction_id)
    expected: fail
    perkiraan_baris: 21
    justifikasi: Header tanpa item membuat total header tidak bisa dijelaskan pada grain fact item; unitnya baris header.
  - name: item_produk_orphan_k9
    topic: t2
    severity: blocking
    scope: source
    sql: >-
      WITH slice AS (SELECT t.* FROM raw_transactions t WHERE t.outlet_id = 'OUT-A' AND CAST(CASE WHEN
      upper(trim(t.tanggal_waktu)) LIKE '%Z' THEN TRY_CAST(t.tanggal_waktu AS TIMESTAMPTZ) AT TIME ZONE
      'Asia/Jakarta' ELSE TRY_CAST(t.tanggal_waktu AS TIMESTAMP) END AS DATE) >= DATE '2025-01-01' AND
      CAST(CASE WHEN upper(trim(t.tanggal_waktu)) LIKE '%Z' THEN TRY_CAST(t.tanggal_waktu AS TIMESTAMPTZ) AT
      TIME ZONE 'Asia/Jakarta' ELSE TRY_CAST(t.tanggal_waktu AS TIMESTAMP) END AS DATE) < DATE '2025-07-01')
      SELECT count(*) FROM raw_transaction_items i WHERE EXISTS (SELECT 1 FROM slice t WHERE
      t.transaction_id=i.transaction_id) AND NOT EXISTS (SELECT 1 FROM raw_products p WHERE
      p.product_id=i.product_id)
    expected: pass
    perkiraan_baris: 0
    justifikasi: Item tanpa produk tidak bisa dipetakan ke dimensi produk; unitnya baris item mentah.
  # ---------------------------------------------------------------- T3 Cuaca BMKG
  - name: duplikat_grain_desa_slot
    topic: t3
    severity: blocking
    scope: source
    sql: >-
      SELECT count(*) FROM (SELECT adm4, local_datetime FROM raw_prakiraan_cuaca
      GROUP BY 1,2 HAVING count(*) > 1)
    expected: pass
    perkiraan_baris: 0
    justifikasi: Grain = satu desa per slot; kembar berarti snapshot tertarik dua kali.
  - name: curah_hujan_negatif
    topic: t3
    severity: blocking
    scope: source
    sql: >-
      SELECT count(*) FROM raw_prakiraan_cuaca WHERE TRY_CAST(tp AS DOUBLE) < 0
    expected: pass
    perkiraan_baris: 0
    justifikasi: Curah hujan tidak bisa negatif; kalau ada, satuannya bukan mm.
  - name: kolom_vs_kosong_seluruhnya
    topic: t3
    severity: warning
    scope: source
    sql: >-
      SELECT count(*) FROM raw_prakiraan_cuaca WHERE vs IS NULL OR vs = ''
    expected: fail
    perkiraan_baris: 1156
    justifikasi: Kolom 100% kosong — putuskan dibuang atau diisi, jangan dibiarkan masuk dimensi.
  - name: deskripsi_cuaca_dipakai_lebih_dari_satu_kode
    topic: t3
    severity: warning
    scope: source
    sql: >-
      SELECT count(*) FROM (SELECT weather_desc FROM raw_prakiraan_cuaca
      GROUP BY 1 HAVING count(DISTINCT weather) > 1)
    expected: fail
    perkiraan_baris: 1
    justifikasi: Kode 0 dan 1 dua-duanya 'Cerah' — kamus tidak 1:1, jadi deskripsi tidak boleh jadi kunci.
  - name: curah_hujan_nol_tidak_wajar
    topic: t3
    severity: warning
    scope: source
    sql: >-
      SELECT count(*) FROM raw_prakiraan_cuaca WHERE TRY_CAST(tp AS DOUBLE) = 0
    expected: fail
    perkiraan_baris: 812
    justifikasi: 70% slot kering — cukup untuk membatalkan 'curah hujan' sebagai satu-satunya measure.
  - name: time_index_sebagai_jam
    topic: t3
    severity: warning
    scope: source
    sql: >-
      SELECT count(*) FROM raw_prakiraan_cuaca WHERE TRY_CAST(split_part(time_index, '-', 1) AS INT) > 23
    expected: fail
    perkiraan_baris: 625
    justifikasi: time_index adalah offset jam (11-37), bukan jam dinding — kalau dipakai sebagai jam, analisis waktu salah.
